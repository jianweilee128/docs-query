[project]
name = "llm-docs-rag"
version = "0.1.0"
description = "Documentation querying tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.122.0",
    "chromadb>=1.5.9",
    "openai>=3.0.0",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag", "config"]
